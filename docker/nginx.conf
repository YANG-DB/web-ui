# Serves the built app and forwards the two backends, like the dev proxy (client/src/setupProxy.js).
server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS. With the upstreams in variables, nginx resolves them per request, so it
  # starts even while fuse or mock are still starting (or restarting).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $fuse http://fuse:8888;
  set $mock http://mock:5001;

  # Trailing slashes matter: the app's own API page is at /api (no slash), and must load
  # index.html; the backends are always called as /api/... and /fuse/...
  location /fuse/ {
    proxy_pass $fuse;
    proxy_read_timeout 300s;
  }

  # The app's API page itself (exact match; otherwise nginx would redirect /api to /api/).
  location = /api {
    try_files /index.html =404;
  }

  location /api/ {
    proxy_pass $mock;
  }

  # Client-side routes (/research, /schema, /api-docs ...) all load index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
