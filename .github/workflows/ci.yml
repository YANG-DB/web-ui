name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    name: Mock server tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      # --ignore-scripts skips the postinstall that installs the client
      - name: Install root dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Run server tests (with coverage gate)
        run: yarn test

      - name: Upload coverage
        if: always() && matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: coverage/
          retention-days: 14

  test-client:
    name: Client tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Install client dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test --watchAll=false --coverage
        env:
          CI: true

      # CI=false: the build would otherwise fail on lint warnings that predate this workflow.
      - name: Build
        run: yarn build
        env:
          CI: false

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/build/
          retention-days: 7

  fuse-integration:
    name: Live Fuse integration (Dragons)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Start OpenSearch and Fuse, load the Dragons sample
        run: scripts/fuse-up.sh

      - name: Install client dependencies
        working-directory: client
        run: yarn install --frozen-lockfile

      - name: Run the Fuse API and template checks
        working-directory: client
        run: yarn test:fuse
        env:
          CI: true
          FUSE_URL: http://localhost:8888

      - name: Fuse logs
        if: failure()
        run: |
          docker logs --tail 300 web-ui-fuse || true
          docker logs --tail 100 web-ui-opensearch || true

      - name: Stop Fuse
        if: always()
        run: scripts/fuse-down.sh

  compose:
    name: Docker Compose (graph + data + UI in one command)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose up
        run: docker compose up -d --build

      - name: Wait for the Dragons data to load
        run: |
          # exits with the loader's own exit status
          docker compose wait dragons-loader
          docker compose logs dragons-loader

      - name: The UI answers and forwards /fuse and /api
        run: |
          curl -sf http://localhost:3000/ | grep -q '<div id="root">'
          curl -sf http://localhost:3000/research | grep -q '<div id="root">'
          curl -sf http://localhost:3000/api | grep -q '<div id="root">'
          curl -sf http://localhost:3000/fuse/health | grep -q 'Alive'
          curl -sf http://localhost:3000/api/ontologies | grep -q 'dragons'

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: client/yarn.lock

      # The live suite, through the UI container's nginx
      - name: Fuse checks through the UI
        working-directory: client
        run: |
          yarn install --frozen-lockfile
          yarn test:fuse
        env:
          CI: true
          FUSE_URL: http://localhost:3000

      - name: Logs
        if: failure()
        run: docker compose logs --tail 200

      - name: docker compose down
        if: always()
        run: docker compose down -v
