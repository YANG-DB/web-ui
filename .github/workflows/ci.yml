name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-server:
    name: Test Server API
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Verify Jest installation
        run: yarn list jest

      - name: Run server tests
        run: yarn test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: matrix.node-version == '20.x'
        with:
          file: ./coverage/coverage-final.json
          flags: server
          name: server-coverage
        continue-on-error: true

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-${{ matrix.node-version }}
          path: coverage/
          retention-days: 30

  test-client:
    name: Test Client Application
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install root dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Install client dependencies
        run: cd client && (yarn install --frozen-lockfile || yarn install)

      - name: Run client tests
        run: cd client && yarn test --watchAll=false --coverage
        continue-on-error: true

      - name: Upload client coverage
        uses: codecov/codecov-action@v5
        if: matrix.node-version == '20.x'
        with:
          file: ./client/coverage/coverage-final.json
          flags: client
          name: client-coverage
        continue-on-error: true

  build-client:
    name: Build Client Application
    runs-on: ubuntu-latest
    needs: [test-server, test-client]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install root dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Install client dependencies
        run: cd client && (yarn install --frozen-lockfile || yarn install)

      - name: Build client
        run: cd client && yarn build
        env:
          CI: false

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/build/
          retention-days: 7

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Install client dependencies
        run: cd client && (yarn install --frozen-lockfile || yarn install)

      - name: Run ESLint
        run: cd client && yarn lint || echo "Linting completed with warnings"
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: yarn audit --level moderate || echo "Audit completed with warnings"
        continue-on-error: true

      - name: Run client npm audit
        run: cd client && yarn audit --level moderate || echo "Client audit completed with warnings"
        continue-on-error: true

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test-server, test-client, build-client, lint, security-scan]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "Pipeline completed!"
          echo "Server tests: ${{ needs.test-server.result }}"
          echo "Client tests: ${{ needs.test-client.result }}"
          echo "Build: ${{ needs.build-client.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Security: ${{ needs.security-scan.result }}"
