name: Release

# A version tag (vX.Y.Z) publishes a GitHub release with the deployment package and the
# matching CHANGELOG.md section as notes. Pushes to master build the same package as an
# artifact. See docs/RELEASING.md.
on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Test, build and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            client/yarn.lock

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          cd client && yarn install --frozen-lockfile

      - name: Server tests
        run: yarn test

      - name: Client tests
        working-directory: client
        run: yarn test --watchAll=false
        env:
          CI: true

      - name: Build client
        working-directory: client
        run: yarn build
        env:
          CI: false

      - name: Check the tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json client/package.json; do
            v="$(node -p "require('./$f').version")"
            if [ "$v" != "$tag" ]; then
              echo "::error file=$f::version $v does not match tag v$tag"
              exit 1
            fi
          done

      - name: Create deployment package
        run: |
          name="web-ui-${GITHUB_REF_NAME//\//-}"
          mkdir -p "dist/$name"
          cp -r client/build "dist/$name/client"
          cp -r server.js package.json yarn.lock mocks scripts docs README.md CHANGELOG.md LICENSE "dist/$name/"
          tar -czf "$name.tar.gz" -C dist "$name"
          echo "PACKAGE=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: ${{ env.PACKAGE }}
          retention-days: 90

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error file=CHANGELOG.md::no section for $version"
            exit 1
          fi

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE }}
          body_path: release-notes.md
